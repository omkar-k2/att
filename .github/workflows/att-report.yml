name: Show Attendance (Log View)

on:
  workflow_dispatch:
    inputs:
      lecture_date:
        description: "Enter Lecture Date (DDMMYYYY) Example: 27022026"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  show-attendance:
    runs-on: ubuntu-latest

    steps:
      # Required for gh CLI to know the repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI & jq
        run: |
          sudo apt update
          sudo apt install gh jq -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      # Convert DDMMYYYY → YYYY-MM-DD
      - name: Convert Date Format
        run: |
          INPUT="${{ github.event.inputs.lecture_date }}"

          if [[ ! "$INPUT" =~ ^[0-9]{8}$ ]]; then
            echo "Invalid format. Use DDMMYYYY (Example: 27022026)"
            exit 1
          fi

          DAY=${INPUT:0:2}
          MONTH=${INPUT:2:2}
          YEAR=${INPUT:4:4}

          FORMATTED_DATE="$YEAR-$MONTH-$DAY"
          echo "FORMATTED_DATE=$FORMATTED_DATE" >> $GITHUB_ENV

          echo "Converted Date: $FORMATTED_DATE"

      - name: Fetch Attendance Runs
        run: |
          mkdir attendance_data

          gh run list \
            --repo ${{ github.repository }} \
            --workflow="att.yml" \
            --status=success \
            --limit 200 \
            --json databaseId > runs.json

      - name: Download Attendance Artifacts
        run: |
          run_ids=$(jq -r '.[].databaseId' runs.json)

          for id in $run_ids
          do
            gh run download $id \
              --repo ${{ github.repository }} \
              -D attendance_data || true
          done

      - name: Display Attendance in Logs
        run: |
          echo "======================================"
          echo "Attendance for $FORMATTED_DATE"
          echo "======================================"

          count=0

          for file in attendance_data/**/*.txt
          do
            [ -f "$file" ] || continue

            date=$(grep "Lecture Date:" "$file" | cut -d':' -f2 | xargs)

            if [ "$date" == "$FORMATTED_DATE" ]; then
              name=$(grep "Name:" "$file" | cut -d':' -f2 | xargs)
              user=$(grep "GitHub Username:" "$file" | cut -d':' -f2 | xargs)
              topic=$(grep "Lecture Topic:" "$file" | cut -d':' -f2 | xargs)

              echo "$((++count)). $name | $user | $topic"
            fi
          done

          echo "--------------------------------------"
          echo "Total Students Present: $count"
          echo "======================================"

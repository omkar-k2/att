name: Classroom Attendance

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: "Enter your Full Name (Example: Rohit Sharma)"
        required: true
      lecture_topic:
        description: "Enter Today's Lecture Topic"
        required: true

jobs:
  mark-attendance:
    runs-on: ubuntu-latest

    # 🔒 Prevent parallel runs from same user
    concurrency:
      group: attendance-${{ github.actor }}
      cancel-in-progress: false

    steps:
      # 🚫 Stop if this user already has a successful run today
      - name: Check If Already Marked
        run: |
          echo "Checking previous runs..."

          RUN_COUNT=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --actor="${{ github.actor }}" \
            --status=success \
            --json createdAt \
            --jq '. | length')

          if [ "$RUN_COUNT" -ge 1 ]; then
            echo "Attendance already marked. Re-run not allowed."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Validate Name Format
      - name: Validate Full Name
        run: |
          if [[ ! "${{ github.event.inputs.full_name }}" =~ ^[A-Za-z]+\ [A-Za-z]+$ ]]; then
            echo "Invalid name format."
            exit 1
          fi

      # Generate Receipt
      - name: Generate Attendance Receipt
        run: |
          echo "Attendance Confirmation" > attendance.txt
          echo "-----------------------" >> attendance.txt
          echo "Name: ${{ github.event.inputs.full_name }}" >> attendance.txt
          echo "Lecture Topic: ${{ github.event.inputs.lecture_topic }}" >> attendance.txt
          echo "GitHub Username: ${{ github.actor }}" >> attendance.txt
          echo "Timestamp (UTC): $(date -u)" >> attendance.txt

      # Upload Artifact
      - name: Upload Attendance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-${{ github.actor }}
          path: attendance.txt
          retention-days: 30

      - name: Success Message
        run: echo "Attendance marked successfully!"

name: Secure Classroom Attendance

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: "Enter your Full Name (Example: Rohit Sharma)"
        required: true
      lecture_code:
        description: "Enter Today's Lecture Code (Provided in Class)"
        required: true

jobs:
  mark-attendance:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Validate 60-Second Time Window (Adjust UTC Time)
      - name: Validate Time Window
        run: |
          START_TIME="04:30:00"   # Example: 10:00 AM IST = 04:30 UTC
          END_TIME="04:31:00"     # 1 minute window

          NOW=$(date -u +%H:%M:%S)

          if [[ "$NOW" < "$START_TIME" || "$NOW" > "$END_TIME" ]]; then
            echo "Attendance window closed!"
            exit 1
          fi

      # 2️⃣ Validate Lecture Code (Change Daily)
      - name: Validate Lecture Code
        run: |
          if [ "${{ github.event.inputs.lecture_code }}" != "DOCKER27" ]; then
            echo "Invalid Lecture Code!"
            exit 1
          fi

      # 3️⃣ Validate Name Format
      - name: Validate Full Name Format
        run: |
          if [[ ! "${{ github.event.inputs.full_name }}" =~ ^[A-Za-z]+\ [A-Za-z]+$ ]]; then
            echo "Invalid name format. Use: Firstname Lastname"
            exit 1
          fi

      # 4️⃣ Generate Attendance Receipt
      - name: Generate Attendance Receipt
        run: |
          echo "Attendance Confirmation" > attendance.txt
          echo "-----------------------" >> attendance.txt
          echo "Name: ${{ github.event.inputs.full_name }}" >> attendance.txt
          echo "GitHub User: ${{ github.actor }}" >> attendance.txt
          echo "Lecture Code: ${{ github.event.inputs.lecture_code }}" >> attendance.txt
          echo "Timestamp (UTC): $(date -u)" >> attendance.txt

      # 5️⃣ Upload Artifact
      - name: Upload Attendance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-${{ github.actor }}-$(date -u +%Y-%m-%d)
          path: attendance.txt
          retention-days: 30

      - name: Success Message
        run: echo "Attendance marked successfully!"

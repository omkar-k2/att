name: Classroom Attendance

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: "Enter your Full Name (Example: Rohit Sharma)"
        required: true
      lecture_topic:
        description: "Enter Today's Lecture Topic"
        required: true

jobs:
  mark-attendance:
    runs-on: ubuntu-latest

    # Prevent parallel runs from same user
    concurrency:
      group: attendance-${{ github.actor }}
      cancel-in-progress: false

    steps:
      # ✅ Allow only once per day
      - name: Check If Already Marked Today
        run: |
          echo "Checking today's attendance..."

          TODAY=$(date -u +%Y-%m-%d)

          RUN_COUNT=$(gh run list \
            --workflow="Classroom Attendance" \
            --user="${{ github.actor }}" \
            --status=success \
            --json createdAt \
            --limit 50 \
            --jq "[.[] | select(.createdAt | startswith(\"$TODAY\"))] | length")

          if [ "$RUN_COUNT" -ge 1 ]; then
            echo "Attendance already marked for today."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Validate Name Format (First + Last name only)
      - name: Validate Full Name
        run: |
          if [[ ! "${{ github.event.inputs.full_name }}" =~ ^[A-Za-z]+\ [A-Za-z]+$ ]]; then
            echo "Invalid name format. Use FirstName LastName"
            exit 1
          fi

      # Generate Attendance Receipt
      - name: Generate Attendance Receipt
        run: |
          echo "Attendance Confirmation" > attendance.txt
          echo "-----------------------" >> attendance.txt
          echo "Name: ${{ github.event.inputs.full_name }}" >> attendance.txt
          echo "Lecture Topic: ${{ github.event.inputs.lecture_topic }}" >> attendance.txt
          echo "GitHub Username: ${{ github.actor }}" >> attendance.txt
          echo "Timestamp (UTC): $(date -u)" >> attendance.txt

      # Upload Artifact
      - name: Upload Attendance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-${{ github.actor }}
          path: attendance.txt
          retention-days: 30

      - name: Success Message
        run: echo "Attendance marked successfully!"
